---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: hypratomic
description: Fedora Atomic + Wayblue Hyprland, prepared for an Omarchy-inspired desktop.

# Wayblue currently supports the `latest` tag for end-user rebases.
# As of 2026-09-18 this resolves to its Fedora 44 Hyprland image.
base-image: ghcr.io/wayblueorg/hyprland
image-version: latest

modules:
  # Keep our system-owned files in the immutable image. BlueBuild moves
  # image-time /etc content to /usr/etc as appropriate for Atomic systems.
  - type: files
    files:
      - source: system
        destination: /

  # Keep Wayblue's compositor/session integration. Explicitly install the idle,
  # lock and keyring tools used by hypratomic-session; the base may omit them.
  - type: dnf
    repos:
      # Fedora installation source documented by Yazi upstream.
      copr:
        - lihaohong/yazi
      cleanup: true
    install:
      packages:
        - quickshell
        - foot
        - tmux
        - neovim
        - yazi # launched inside Foot
        - file # Yazi file type detection
        - btop
        - fastfetch
        - fzf
        - ripgrep
        - fd-find
        - python3 # transactional activation/restoration (standard library only)
        - cliphist # clipboard history; wl-clipboard/wofi come from Wayblue
        - swayidle
        - swaylock
        - swaybg
        - gnome-keyring # provides /usr/bin/gnome-keyring-daemon
        - jetbrains-mono-fonts
        - cascadia-mono-nf-fonts
        - ImageMagick

    remove:
      packages:
        - kitty
        - kitty-kitten
        - kitty-shell-integration
        - kitty-terminfo
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - com.vivaldi.Vivaldi
          - md.obsidian.Obsidian
          # - org.mozilla.firefox
          # - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: script
    scripts:
      - terminal-defaults.sh
      - validate-hypratomic.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
