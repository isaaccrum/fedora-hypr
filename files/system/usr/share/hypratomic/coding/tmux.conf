# Optional starting point for the Foot -> Tmux -> Neovim workflow.
# Copy to ~/.config/tmux/tmux.conf before editing; image updates never replace it.
# Ctrl-a is the only multiplexer prefix. Hyprland owns Super; Neovim owns its
# leader and modal keys. Keep direct bindings limited to pane/session commands.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g history-limit 10000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g status-keys emacs
set -g mode-keys vi

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Keep pane movement on prefix + arrows so Ctrl-h/j/k/l remains available to
# Neovim and shell programs. Resize with prefix + Shift + arrows.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind S-Left resize-pane -L 5
bind S-Down resize-pane -D 5
bind S-Up resize-pane -U 5
bind S-Right resize-pane -R 5
