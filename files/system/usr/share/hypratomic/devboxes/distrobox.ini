# Managed starting points for project-local development environments.
# Keep source trees on the host; toolchains and build dependencies stay here.

[hypratomic-rust]
image=registry.fedoraproject.org/fedora-toolbox:44
additional_packages="git gcc gcc-c++ make cmake pkgconf-pkg-config rust cargo rustfmt rust-clippy rust-analyzer"
init=false
pull=true
replace=false
root=false
start_now=false

[hypratomic-typescript]
image=registry.fedoraproject.org/fedora-toolbox:44
additional_packages="git gcc gcc-c++ make python3 nodejs npm"
init=false
pull=true
replace=false
root=false
start_now=false
