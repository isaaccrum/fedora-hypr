# Omarchy-inspired workflow, using Fedora/Wayblue applications.
bind = SUPER, Return, exec, $terminal
bind = SUPER SHIFT, Return, exec, $browser
bind = SUPER SHIFT, B, exec, $browser
bind = SUPER SHIFT, F, exec, $fileManager
bind = SUPER, space, exec, $menu
bind = SUPER, V, exec, hypratomic-clipboard
bind = , Print, exec, hypratomic-screenshot
bind = SUPER, Escape, exec, loginctl lock-session
bind = SUPER, W, killactive,
bind = SUPER, F, fullscreen, 0
bind = SUPER, T, togglefloating,
bind = SUPER, J, togglesplit,
bind = SUPER, left, movefocus, l
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER, right, movefocus, r
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER, up, movefocus, u
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER, 1, workspace, 1
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER, 2, workspace, 2
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER, 6, workspace, 6
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER, 7, workspace, 7
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER, 8, workspace, 8
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER SHIFT, S, movetoworkspacesilent, special:scratchpad
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --min-value=1 set 10%-
bindel = , XF86AudioPlay, exec, playerctl play-pause
bindel = , XF86AudioNext, exec, playerctl next
bindel = , XF86AudioPrev, exec, playerctl previous
